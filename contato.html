<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style_contato.css">
    <title>IA Fácil</title>
  </head>
  <body>
    <main>
      <section>
        <h2>Entre em contato</h2>
        <p>Preencha os campos abaixo. Nesta etapa, o formulário ainda não enviará os dados para um servidor.</p>
        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" nome="nome"required>

            <label for="email">E-mail</label>
            <input type="email" id="email" email="email"required>

            <label for="assunto">Assunto:</label>
            <select id="assunto" assunto="assunto"required>
                <option value="">Selecione</option>
                <option value="duvida">Dúvida</option>
                <option value="solicitacao">Solicitação</option>
                <option value="sugestao">Sugestão</option>
            </select>

            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem" rows="5"required></textarea>
            <button type="submit">Enviar</button>


        </form>
    </section>
    </main>
  </body>
</html>
